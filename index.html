<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>户型 3D：描户型图，生成能走动的 3D 模型</title>
<meta name="description" content="上传户型图，描出墙和门窗，自动生成可以走动的 3D 模型；接入自己的大模型 API 布置家具、换配色、出采购清单。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15 16 5l12 10v12H4z' fill='%239A6B3F'/%3E%3Cpath d='M13 27v-7h6v7' fill='%23F2F3EF'/%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <b>户型 3D</b>
    <input id="proj-name" class="proj-name" aria-label="方案名称" maxlength="40">
  </div>
  <div class="tabs" role="tablist" aria-label="视图">
    <button type="button" role="tab" id="tab-3d" data-tab="3d" aria-selected="true" aria-controls="pane-3d">3D 浏览</button>
    <button type="button" role="tab" id="tab-2d" data-tab="2d" aria-selected="false" aria-controls="pane-2d">2D 编辑</button>
  </div>
  <div class="actions">
    <button type="button" class="btn" id="btn-undo" title="撤销（Ctrl+Z）" disabled>撤销</button>
    <button type="button" class="btn" id="btn-redo" title="重做（Ctrl+Shift+Z）" disabled>重做</button>
    <details class="menu" id="file-menu">
      <summary class="btn">文件</summary>
      <div class="menu-list">
        <button type="button" data-file="new">新建空白方案</button>
        <button type="button" data-file="example">打开示例：01 房</button>
        <button type="button" data-file="import">导入 JSON…</button>
        <button type="button" data-file="export">导出 JSON</button>
      </div>
    </details>
    <input type="file" id="file-input" accept=".json,application/json" hidden>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <div id="pane-3d" class="pane" role="tabpanel" aria-labelledby="tab-3d">
      <div class="chips" id="views" role="group" aria-label="视角"></div>
      <div class="viewer" id="viewer" tabindex="0" aria-label="3D 户型，可拖动转头、点地面走动">
        <div class="info" id="info" hidden aria-live="polite"></div>
        <div class="empty" id="empty3d" hidden>还没有墙。到“2D 编辑”里上传户型图描一遍，或者在“文件”里打开示例。</div>
      </div>
    </div>
    <div id="pane-2d" class="pane" role="tabpanel" aria-labelledby="tab-2d" hidden></div>
  </section>

  <aside class="side">
    <div class="side-tabs" role="tablist" aria-label="面板">
      <button type="button" role="tab" data-side="plan" aria-selected="true">方案</button>
      <button type="button" role="tab" data-side="ai" aria-selected="false">大模型</button>
      <button type="button" role="tab" data-side="list" aria-selected="false">清单</button>
    </div>
    <div class="side-body" id="side-plan"></div>
    <div class="side-body" id="side-ai" hidden></div>
    <div class="side-body" id="side-list" hidden></div>
  </aside>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
